<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 80%;
            max-width: 600px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 4px;
            border: none;
            margin-bottom: 15px;
            box-sizing: border-box;
            color: #000;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enter a URL to visit</h2>
        <input type="text" id="urlInput" placeholder="https://example.com" value="https://">
        <button onclick="launchProxy()">Go</button>
    </div>

    <script>
        function launchProxy() {
            const destination = document.getElementById('urlInput').value.trim();
            if (destination && destination !== 'https://') {
                window.location.href = `/proxy?url=${encodeURIComponent(destination)}`;
            } else {
                alert('Please enter a valid URL');
            }
        }
    </script>
</body>
</html>

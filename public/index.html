<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Development Terminal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            border: 1px solid #334155;
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
            font-weight: 600;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        button {
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .status-footer {
            margin-top: 15px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Secure Web Terminal</h2>
        <p>Enter a target URL to route requests securely through your personal Node.js backend infrastructure instance.</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://example.com" value="https://">
            <button onclick="launchProxy()">Establish Connection</button>
        </div>
        
        <div class="status-footer" id="sessionStatus">
            Session: Authenticating token...
        </div>
    </div>

    <script>
        // Automatically extract the password parameter from the browser's address bar
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('pwd');
        
        const statusElement = document.getElementById('sessionStatus');
        if (token) {
            statusElement.innerText = `Authenticated Session Token: Active (${token})`;
            statusElement.style.color = "#4ade80";
        } else {
            statusElement.innerText = "Warning: No session token detected. Requests may be blocked.";
            statusElement.style.color = "#f87171";
        }

        function launchProxy() {
            const destination = document.getElementById('urlInput').value.trim();
            
            if (destination && destination !== 'https://') {
                // Construct the destination URL, appending the verified password token back to the route
                let proxyUrl = `/proxy?url=${encodeURIComponent(destination)}`;
                if (token) {
                    proxyUrl += `&pwd=${encodeURIComponent(token)}`;
                }
                
                window.location.href = proxyUrl;
            } else {
                alert('Please enter a valid target URL.');
            }
        }
    </script>
</body>
</html>
